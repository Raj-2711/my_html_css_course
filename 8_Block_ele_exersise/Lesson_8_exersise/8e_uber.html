    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            h2{
                font-family: Arial, Helvetica, sans-serif;
                font-size:35px;
                font-weight:lighter;
                margin-bottom:20px

            }

            .location-box,.destination-box  {
                display:block;
                width:330px;
                padding:12px 16px;
                font-size: 16px;
                color:grey;
                margin-bottom: 10px;
                background-color: rgb(237, 232, 232);
                border:none;
            

            }
            .request-btn{
                margin-top:10px;
                padding: 15px 18px;
                background-color: black;
                color:white;
                border:none;
                cursor: pointer;
                
                font-size: 16px;
                 transition: all 1s;
            }

            .schedule-btn{
                margin-left:10px;
                padding: 15px 18px;
                border:none;
                font-size: 16px;
                background-color:rgb(235, 226, 226);
                cursor:pointer;
                transition: all 1s;
              

            }

            .schedule-btn:hover{
               
                background-color: rgb(62, 99, 202);
                color: white;
                box-shadow: 0px 0px 10px 0px rgb(62, 99, 202);
            }

            .request-btn:hover{
               background-color: rgb(138, 18, 16);
                box-shadow: 0px 0px 10px 0px rgb(138, 18, 16);
                  padding: 16px 19px;
                 `
            } 
           
            
            .location-box:focus,.destination-box:focus{
                outline:blue auto 1px;
            }

            .schedule-btn:active,.request-btn:active{
                box-shadow: 1px 1px 5px 0px rgb(161, 160, 160);
                outline: blue auto 1px;
            }

        </style>
    </head>
    <body>
        <h2>Request a ride now</h2>
        <input type="text" class="location-box" placeholder="Enter pickup location ">
        <input type="text" class="destination-box" placeholder="Enter destination ">
        
       <button class="request-btn">Request now</button>
       <button class="schedule-btn">Schedule for later</button>


        
    </body>
    </html>
