<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
</head>
<body>

    <!-- 11 a. exersise -->
    <div style="display: grid;
     grid-template-columns: 200px 75px ; "
    >    
        <div style="background-color:skyblue;">200px</div>

    <div style=" background-color:lightpink;">75 px</div>

    </div>


    <br><br>
 
     <!-- 11 b. exersise -->

    <div style="display: grid;
    grid-template-columns:55px 1fr 80px ">
        <div style="background-color: skyblue ;"> 1column</div>
        <div style="background-color: lightpink;"> 2column</div>
        <div style="background-color: skyblue ;">3column</div>
    </div>

    <br><br>


     <!-- 11 c. exersise -->

    <div style="display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    column-gap:20px;
    row-gap:10px;">
        <div style="background-color: skyblue;">col1</div>
        <div style="background-color: lightpink;">col2</div>
        <div style="background-color: skyblue;">col3</div>
        <div style="background-color: lightpink;">col4</div>
        <div style="background-color: lightpink;">col1</div>
        <div style="background-color: skyblue;">col2</div>
        <div style="background-color: lightpink;">col3</div>
        <div style="background-color: skyblue;">col4</div>
    </div>


</body>
</html>
