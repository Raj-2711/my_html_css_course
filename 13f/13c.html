<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gmail inbox</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .main-cotainer{
          
            width: 380px;
           
            border: solid 1px grey;
            box-shadow: 1px 0px 1px 0px gray;
            
            
            
            
        }
        .inbox-div{
            color: grey;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 10px;
            margin-left: 10px;
            font-size: 14px;
        }
        .row-div{
            display: flex;
            margin-bottom: 20px;
        }

        .cat_pic{
           width: 45px;
           height: 45px;
           object-fit: cover;
           object-position: center;
           border-radius: 50%;
           margin-top: 25px;
           margin-right: 4px;
           margin-left: 15px;
           border: none;
        
        }
        .inside-container{
           
            
            margin-top: 16px;
            
           
        }
        .new-div{
            display: flex;
            flex-direction: row;
            width: 300px;
            justify-content: space-between; 
        }        
         .time-div{
            color: gray;
            font-size: 13px;
         }

         .heading-div{
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;

         }
         .second-heading{
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 3px;
         }
         .dis-div{
            color: gray;
            font-size: 14px;
         }
    </style>
</head>
<body>
    <div class="main-cotainer">
      <div class="inbox-div">All INBOXES</div>


        <div class="row-div">
            
              <div class="img-div">
                 <img class="cat_pic" src="image_folder/image.png" alt="">
              </div>
       
           <div class="inside-container">
            <div class="new-div">
                <div class="heading-div">Chewy Promotions</div>
               <div class="time-div">4:58 PM</div>
            </div>
            <div class="second-heading">Biggest sales of the year !</div>
            <div class="dis-div">Hey there! we're writing to tell you about our....</div>
               
           </div>
         

           

              

        </div>

          <div class="row-div">
            
              <div class="img-div">
                 <img class="cat_pic" src="image_folder/cat_3.jpg" alt="">
              </div>
       
           <div class="inside-container">
            <div class="new-div">
                <div class="heading-div">Best buy</div>
               <div class="time-div">12:32 PM</div>
            </div>
            <div class="second-heading">Your Best Buy eRecepit </div>
            <div class="dis-div">Thank you for shopping at Best Buy,here is..</div>
               
           </div>
         </div>
         
         <div class="row-div">
            
              <div class="img-div">
                 <img class="cat_pic" src="image_folder/new_cat1.avif" alt="">
              </div>
       
           <div class="inside-container">
               <div class="new-div">
                <div class="heading-div">Netflix</div>
               <div class="time-div">9:00 PM</div>
              </div>
               <div class="second-heading">Here's what's coming soon Netflix</div>
              <div class="dis-div">Brand new movies and shows, old favorites....</div>
               
           </div>
         </div>
         
    </div>
</body>
</html>
