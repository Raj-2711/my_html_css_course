<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
      p{
        font-family: Arial, Helvetica, sans-serif;
        margin-bottom: 2px;
        margin-top: 2px;
       

      }
      h2{
        margin-top: 5px;
        margin-bottom: 5px;
      }
      h1{
        margin-top: 5px;
        margin-bottom: 10px;
      }
      button{
        background-color: rgb(62, 80, 218);
        color: white;
        border-radius: 15px;
        margin-top: 10px;
        padding: 8px 15px;
        border: none;
        font-weight: bold;

      }
      button:hover{
        background-color: rgb(4, 4, 214);
      }
      button:active{
        box-shadow: 0px 0px 5px 0px grey;
      }
      .new-btn{ 
        color: orange;
      }
      
    </style>
</head>
<body>

    <p class="new-btn">New</p>
    <h2>MacBook Pro</h2>
    <h1>Supercharged for pros.</h1>
    <p>Form $1999</p>
    <button>Buy</button>
    
</body>
</html>
