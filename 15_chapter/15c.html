<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         body{
            height: 3000px;
        }
        .btn-container{
          position: absolute;
          top: -20px;
          left: -20px;

         
        }
        button{
            background-color: rgb(9, 9, 9);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 25px;
            font-size: 16px;
            font-family: roboto, Arial, Helvetica, sans-serif;
        }

        .box-div{
            width: 320px;
            height: 180px;
            background-color: rgb(93, 91, 91);
            position: fixed;
            bottom: 20px; 
            right: 20px; 
        }
        .time-space{
            position: absolute;
            background-color: black;
            color: white;
             padding-left: 5px;
             padding-right: 5px;
             padding-bottom: 3px;
             padding-top: 3px;
             font-family: Arial, Helvetica, sans-serif;
             border-radius: 3px;
            right: 10px;
            bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="box-div">
         <div class="btn-container">
        <button>X</button>
        
    </div>
    <div class="time-space">0:29</div>
    </div>
    
</body>
</html>
