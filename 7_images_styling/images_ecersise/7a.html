<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cat</title>
    <style>
        .Cat-1{
            width: 170px;
            height:180px;
            object-fit: cover;
            object-position: center;
            
        }
        .Cat-2{
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin-left: 20px;
            object-position: center;

        }

        .Cat-3{
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
            margin-left: 30px;
            border-radius: 100px;


        }
        .cat-div{
            display: inline-block;

        }
        .user_name{
            font-family: Arial, Helvetica, sans-serif;
            font-weight:bold;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 4px;
            
           

        }
        .mutual{
            font-family: Arial, Helvetica, sans-serif;
            font: size 14px;
            color: grey;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 4px;
        }

        .cat-div{
            margin-top: 10px;
            margin-left: 5px;
            box-shadow: 0px 0px 1px 1px grey;
            padding-bottom: 10px;
        }

        .Add_btn{
            margin-left: 4px;
            background-color: rgb(60, 60, 205);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 5px;
            cursor: pointer;
         }

         .Add_btn:hover{
            opacity: 0.8;
         }

    </style>
</head>
<body>

    <div class="cat-div">
        <img class="Cat-1"  src="cat_pic/image.png" alt="Cat">
        <h3 class="user_name">Oliver</h3>
        <p class="mutual">2 mutual friends</p>
        <button class="Add_btn">Add Friend</button>
    </div>
     <img class="Cat-2"  src="cat_pic/image.png" alt="Cat">
      <img class="Cat-3"  src="cat_pic/image.png" alt="Cat">
</body>
</html>
